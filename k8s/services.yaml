---
# Service for 2048 Game
apiVersion: v1
kind: Service
metadata:
  name: game-2048-svc
  namespace: game-platform
  labels:
    app: game-2048
  annotations:
    service.beta.kubernetes.io/azure-load-balancer-health-probe-request-path: "/"
spec:
  type: LoadBalancer
  selector:
    app: game-2048
  ports:
  - protocol: TCP
    port: 80
    targetPort: 80
    name: http
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 3600

